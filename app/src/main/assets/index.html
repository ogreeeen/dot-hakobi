<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ドットはこび</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#f3d3a9;font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
  #bar{position:fixed;top:0;left:0;right:0;height:52px;display:flex;align-items:center;gap:8px;padding:0 10px;box-sizing:border-box;z-index:2}
  #bar button,#bar select{height:36px;border:none;border-radius:18px;background:#fff8ee;color:#5a3d1e;font-size:15px;font-weight:700;padding:0 12px;box-shadow:0 2px 0 #c99b66}
  #bar .sp{flex:1}
  #cv{position:fixed;top:52px;left:0;width:100%;height:calc(100% - 52px);touch-action:none}
  .ov{position:fixed;inset:0;background:rgba(60,35,10,.55);display:none;align-items:center;justify-content:center;z-index:5}
  .ov.on{display:flex}
  .card{background:#fff8ee;border-radius:24px;padding:24px 22px;text-align:center;width:min(82vw,340px);box-shadow:0 6px 0 #c99b66}
  .card h2{margin:0 0 8px;color:#5a3d1e;font-size:26px}
  .card p{margin:0 0 16px;color:#7a5a36}
  .card img{width:100%;image-rendering:pixelated;border-radius:8px;margin-bottom:14px}
  .card button{display:block;width:100%;height:48px;margin-top:10px;border:none;border-radius:24px;font-size:17px;font-weight:800;color:#fff;background:#f08a24;box-shadow:0 4px 0 #b55f0c}
  .card button.sub{background:#8a7bd8;box-shadow:0 4px 0 #5b4daa}
  #file,#cam{display:none}
  .crop{text-align:center;color:#fff}
  .crop p{margin:0 0 10px;font-weight:700}
  #cropCv{touch-action:none;border-radius:6px;display:block;margin:0 auto}
  .cb{display:flex;gap:10px;justify-content:center;margin-top:14px}
  .cb button{height:46px;padding:0 18px;border:none;border-radius:23px;font-size:16px;font-weight:800;color:#fff;background:#f08a24;box-shadow:0 4px 0 #b55f0c}
  .cb button.sub{background:#8a7bd8;box-shadow:0 4px 0 #5b4daa}
</style>
</head>
<body>
<div id="bar">
  <button id="pick">📷 写真</button>
  <select id="colors"></select>
  <select id="size">
    <option value="20">粗い</option>
    <option value="28" selected>ふつう</option>
    <option value="36">細かい</option>
  </select>
  <span class="sp"></span>
  <button id="retry">↻</button>
</div>
<canvas id="cv"></canvas>
<input type="file" id="file" accept="image/*">
<input type="file" id="cam" accept="image/*" capture="environment">
<div class="ov" id="startOv"><div class="card">
  <h2>写真でドット絵をつくろう</h2><p>撮影するか、写真を選んでください</p>
  <button id="startCam">📷 撮影する</button>
  <button class="sub" id="startPick">🖼 写真を選ぶ</button>
  <button class="sub" id="startLast" style="background:#b9a58c;box-shadow:0 4px 0 #8a765e">前回の写真で遊ぶ</button>
</div></div>

<div class="ov" id="cropOv"><div class="crop">
  <p>使いたい範囲を指でなぞって囲んでください</p>
  <canvas id="cropCv"></canvas>
  <div class="cb"><button class="sub" id="cropAll">写真全体を使う</button><button id="cropOk">この範囲で作る</button></div>
</div></div>
<div class="ov" id="winOv"><div class="card">
  <h2>クリア！</h2><img id="winImg" alt="">
  <button id="winRetry">もう一度</button>
  <button class="sub" id="winPick">別の写真で遊ぶ</button>
</div></div>
<div class="ov" id="loseOv"><div class="card">
  <h2>スロットがいっぱい</h2><p>運べる色がなくなりました</p>
  <button id="loseAdd">スロットを1つ増やす（1回だけ）</button>
  <button class="sub" id="loseRetry">最初からやり直す</button>
</div></div>

<script>
"use strict";
// ===== 設定 =====
const COLOR_CHOICES = [4,5,6,7,8,9,10];
const DEFAULT_COLORS = 6;
const SPAWN_MS = 300;        // スロットからアリが出てくる間隔
const ANT_SPEED = 170;       // アリの歩く速さ（px/秒）
const COLS = 3;              // ブロックの列数

const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const $ = id => document.getElementById(id);
const selColors = $('colors');
COLOR_CHOICES.forEach(n => { const o = document.createElement('option'); o.value = n; o.textContent = n + '色'; selColors.appendChild(o); });

let opts = load('opts', {colors: DEFAULT_COLORS, size: 28});
selColors.value = opts.colors; $('size').value = opts.size;

let srcData = null;   // 元画像（縮小済みdataURL）
let G = null;         // 現在のゲーム
let dpr = 1, VW = 0, VH = 0, L = {};

function load(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } }
function save(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }

// ===== 乱数（シード付き） =====
function rng(seed){ let s = seed >>> 0 || 1; return () => { s ^= s << 13; s >>>= 0; s ^= s >>> 17; s ^= s << 5; s >>>= 0; return s / 4294967296; }; }

// ===== 画像 → 荒いドット絵 =====
function pixelate(img, width, k){
  const ar = img.height / img.width;
  const W = width, H = Math.max(8, Math.min(Math.round(width * 1.45), Math.round(width * ar)));
  // 縦長すぎる写真は中央を切り抜く
  const srcAr = H / W;
  let sx = 0, sy = 0, sw = img.width, sh = img.height;
  if (img.height / img.width > srcAr){ sh = img.width * srcAr; sy = (img.height - sh) / 2; }
  else { sw = img.height / srcAr; sx = (img.width - sw) / 2; }
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const x = c.getContext('2d'); x.imageSmoothingEnabled = true; x.imageSmoothingQuality = 'high';
  x.drawImage(img, sx, sy, sw, sh, 0, 0, W, H);
  const d = x.getImageData(0, 0, W, H).data;
  const px = [];
  // 彩度とコントラストを少し上げて、ドット絵らしいはっきりした色に
  for (let i = 0; i < W * H; i++){
    let r = d[i*4], g = d[i*4+1], b = d[i*4+2];
    const l = r*.3 + g*.59 + b*.11;
    r = l + (r - l) * 1.3; g = l + (g - l) * 1.3; b = l + (b - l) * 1.3;
    r = (r - 128) * 1.1 + 128; g = (g - 128) * 1.1 + 128; b = (b - 128) * 1.1 + 128;
    px.push([r, g, b].map(v => Math.max(0, Math.min(255, v))));
  }
  // 中央ほど重く扱い、背景より被写体に色を割り当てる
  const wts = new Float32Array(W * H);
  for (let i = 0; i < W * H; i++){
    const dx = ((i % W) + .5) / W - .5, dy = (((i / W) | 0) + .5) / H - .5;
    wts[i] = 1 + 3 * Math.exp(-(dx*dx + dy*dy) / (2 * .2 * .2));
  }
  const {centers, labels} = kmeans(px, k, wts);
  // 明るさ順に並べ替え
  const order = centers.map((c, i) => [i, c[0]*.3 + c[1]*.59 + c[2]*.11]).sort((a, b) => a[1] - b[1]).map(a => a[0]);
  const remap = []; order.forEach((o, i) => remap[o] = i);
  const palette = order.map(i => centers[i].map(v => Math.round(v)));
  const cells = new Int8Array(W * H);
  for (let i = 0; i < W * H; i++) cells[i] = remap[labels[i]];
  return {W, H, palette, cells};
}
function dist2(a, b){ const r = a[0]-b[0], g = a[1]-b[1], bl = a[2]-b[2]; return r*r*.3 + g*g*.59 + bl*bl*.11; }
function kmeans(px, k, wts){
  const R = rng(12345);
  const centers = [px[Math.floor(R() * px.length)].slice()];
  while (centers.length < k){ // k-means++ 初期化
    const ds = px.map((p, i) => wts[i] * Math.min(...centers.map(c => dist2(p, c))));
    const sum = ds.reduce((a, b) => a + b, 0) || 1;
    let r = R() * sum, i = 0;
    for (; i < ds.length - 1; i++){ r -= ds[i]; if (r <= 0) break; }
    centers.push(px[i].slice());
  }
  const labels = new Int32Array(px.length);
  for (let it = 0; it < 14; it++){
    for (let i = 0; i < px.length; i++){
      let b = 0, bd = Infinity;
      for (let j = 0; j < k; j++){ const dd = dist2(px[i], centers[j]); if (dd < bd){ bd = dd; b = j; } }
      labels[i] = b;
    }
    const s = centers.map(() => [0,0,0,0]);
    for (let i = 0; i < px.length; i++){ const t = s[labels[i]], w = wts[i]; t[0]+=px[i][0]*w; t[1]+=px[i][1]*w; t[2]+=px[i][2]*w; t[3]+=w; }
    s.forEach((t, j) => { if (t[3]) centers[j] = [t[0]/t[3], t[1]/t[3], t[2]/t[3]]; });
  }
  // 使われなかった色があっても色数は保つ（空の色は後で除外）
  return {centers, labels};
}

// ===== 盤面ロジック =====
// 外側（盤の外 or 運び出し済み）に面しているピクセルだけが運べる
function exposed(cells, W, H, i){
  const x = i % W, y = (i / W) | 0;
  return x === 0 || y === 0 || x === W-1 || y === H-1 ||
    cells[i-1] < 0 || cells[i+1] < 0 || cells[i-W] < 0 || cells[i+W] < 0;
}
// 色cの運べるピクセルのうち、穴（下中央）に近いものを選ぶ
function pickPixel(cells, W, H, c, res){
  let best = -1, bs = -Infinity;
  const hx = (W - 1) / 2;
  for (let i = cells.length - 1; i >= 0; i--){
    if (cells[i] !== c || (res && res[i]) || !exposed(cells, W, H, i)) continue;
    const x = i % W, y = (i / W) | 0;
    const s = y * 4 - Math.abs(x - hx);
    if (s > bs){ bs = s; best = i; }
  }
  return best;
}

// 必ず解ける順番でブロックを作る（1つずつ運ぶシミュレーション）
function makeBlocks(pz, seed){
  const R = rng(seed);
  const cells = Int8Array.from(pz.cells);
  const W = pz.W, H = pz.H;
  let left = cells.length;
  const seq = [];
  // 色cを今からいくつ続けて運べるか（最大cap）
  const chain = (c, cap) => {
    const tmp = Int8Array.from(cells); let n = 0;
    while (n < cap){ const i = pickPixel(tmp, W, H, c); if (i < 0) break; tmp[i] = -1; n++; }
    return n;
  };
  while (left > 0){
    const m = pz.palette.map((_, c) => chain(c, 35));
    let avail = m.map((v, c) => [c, v]).filter(a => a[1] >= 5);
    if (!avail.length) avail = m.map((v, c) => [c, v]).filter(a => a[1] > 0);
    const [c, maxN] = avail[Math.floor(R() * avail.length)];
    let want = 5 * (2 + Math.floor(R() * 6)); // 10〜35
    if (want > maxN) want = maxN >= 10 ? maxN - maxN % 5 : maxN;
    let n = 0;
    while (n < want){
      const i = pickPixel(cells, W, H, c);
      if (i < 0) break;
      cells[i] = -1; n++; left--;
    }
    const prev = seq[seq.length - 1];
    if (prev && prev.c === c && prev.n + n <= 40) prev.n += n;
    else seq.push({c, n});
  }
  // 少しだけ順番を入れ替えて、考える余地を作る
  for (let i = 0; i + 1 < seq.length; i += 2) if (R() < 0.35){ const t = seq[i]; seq[i] = seq[i+1]; seq[i+1] = t; }
  const cols = Array.from({length: COLS}, () => []);
  seq.forEach((b, i) => cols[i % COLS].push({c: b.c, n: b.n}));
  return cols;
}

function newGame(pz, seed){
  // 実際に使われている色だけ残す
  const used = [...new Set(pz.cells)].sort((a, b) => a - b);
  const map = []; used.forEach((c, i) => map[c] = i);
  const p2 = {W: pz.W, H: pz.H, palette: used.map(c => pz.palette[c]), cells: pz.cells.map(c => map[c])};
  seed = seed || (Date.now() & 0x7fffffff);
  G = {
    pz: p2, seed,
    cells: Int8Array.from(p2.cells),
    left: p2.cells.length,
    cols: makeBlocks(p2, seed),
    slots: Array(Math.max(3, Math.min(7, p2.palette.length - 1))).fill(null), // 色数-1 個のスロット
    added: false,
    ants: [], pops: [], res: new Uint8Array(p2.cells.length),
    over: false, won: false, acc: 0
  };
  hideOv(); layout();
}

// ===== レイアウト =====
function layout(){
  dpr = Math.min(window.devicePixelRatio || 1, 3);
  VW = cv.clientWidth; VH = cv.clientHeight;
  cv.width = Math.round(VW * dpr); cv.height = Math.round(VH * dpr);
  if (!G) return;
  const pad = 14;
  const blockSz = Math.min(76, (VW - 40) / 4.2);
  const colsH = blockSz * 2.9;            // 列エリア
  const slotN = G.slots.length;
  const slotSz = Math.min(66, (VW - 24) / slotN - 8);
  const boardMaxH = VH - colsH - slotSz - 120;
  const cs = Math.max(4, Math.min((VW - pad * 2 - 24) / G.pz.W, boardMaxH / G.pz.H));
  const bw = cs * G.pz.W, bh = cs * G.pz.H;
  const board = {x: (VW - bw) / 2, y: 10 + 12, w: bw, h: bh, cs};
  const hole = {x: VW / 2, y: board.y + bh + 12 + 38, r: 30};
  const slotsY = hole.y + 44;
  const sGap = 8, sW = slotN * slotSz + (slotN - 1) * sGap;
  const slots = G.slots.map((_, i) => ({x: (VW - sW) / 2 + i * (slotSz + sGap), y: slotsY, s: slotSz}));
  const colY = slotsY + slotSz + 22;
  const cGap = 12, cW = COLS * blockSz + (COLS - 1) * cGap;
  const cols = Array.from({length: COLS}, (_, i) => ({x: (VW - cW) / 2 + i * (blockSz + cGap), y: colY, s: blockSz}));
  L = {board, hole, slots, cols};
}

// ===== 入力 =====
cv.addEventListener('pointerdown', e => {
  if (!G || G.over || G.won) return;
  const r = cv.getBoundingClientRect();
  const x = e.clientX - r.left, y = e.clientY - r.top;
  L.cols.forEach((c, ci) => {
    if (x >= c.x && x <= c.x + c.s && y >= c.y && y <= c.y + c.s){
      const col = G.cols[ci];
      if (!col.length) return;
      const si = G.slots.indexOf(null);
      if (si < 0){ G.pops.push({x: c.x + c.s/2, y: c.y - 8, t: 0, text: 'スロットが満杯'}); return; }
      const b = col.shift();
      G.slots[si] = {c: b.c, n: b.n, done: 0, jump: 1, fx: c.x, fy: c.y};
      buzz(10);
    }
  });
});

// ===== ゲーム進行 =====
// 絵を迂回する道（運び出し済みのマスと盤の外周だけを通る）を探す
function findPath(target){
  const W = G.pz.W, H = G.pz.H, EW = W + 2, EH = H + 2;
  const open = (ex, ey) => ex === 0 || ey === 0 || ex === EW - 1 || ey === EH - 1 || G.cells[(ey - 1) * W + (ex - 1)] < 0;
  const tx = target % W + 1, ty = ((target / W) | 0) + 1;
  const sx = Math.round((W - 1) / 2) + 1, sy = EH - 1;          // 穴の真上、盤の下の外周
  const prev = new Int32Array(EW * EH).fill(-2);
  const q = [sy * EW + sx]; prev[q[0]] = -1;
  let found = -1;
  for (let h = 0; h < q.length; h++){
    const cur = q[h], cx = cur % EW, cy = (cur / EW) | 0;
    if (Math.abs(cx - tx) + Math.abs(cy - ty) === 1){ found = cur; break; }
    for (const [dx, dy] of [[0,-1],[-1,0],[1,0],[0,1]]){
      const nx = cx + dx, ny = cy + dy;
      if (nx < 0 || ny < 0 || nx >= EW || ny >= EH) continue;
      const ni = ny * EW + nx;
      if (prev[ni] !== -2 || !open(nx, ny)) continue;
      prev[ni] = cur; q.push(ni);
    }
  }
  if (found < 0) return null;
  const cells = [];
  for (let c = found; c !== -1; c = prev[c]) cells.push(c);
  cells.reverse();
  const b = L.board, pt = (ex, ey) => ({x: b.x + (ex - 1 + .5) * b.cs, y: b.y + (ey - 1 + .5) * b.cs});
  const pts = cells.map(c => pt(c % EW, (c / EW) | 0));
  pts.push(pt(tx, ty));
  return pts;
}
function pathLen(pts){ let d = 0; for (let i = 1; i < pts.length; i++) d += Math.hypot(pts[i].x - pts[i-1].x, pts[i].y - pts[i-1].y); return d; }
function posOn(pts, dist){
  for (let i = 1; i < pts.length; i++){
    const a = pts[i-1], b = pts[i], l = Math.hypot(b.x - a.x, b.y - a.y);
    if (dist <= l || i === pts.length - 1){
      const t = l ? Math.min(1, dist / l) : 1;
      return {x: a.x + (b.x - a.x) * t, y: a.y + (b.y - a.y) * t, ang: Math.atan2(b.y - a.y, b.x - a.x)};
    }
    dist -= l;
  }
  const p = pts[pts.length - 1]; return {x: p.x, y: p.y, ang: 0};
}

function update(dt){
  if (!G || G.over || G.won) return;
  const W = G.pz.W, H = G.pz.H;
  // スロットから0.3秒に1匹ずつアリが出発
  G.slots.forEach((s, si) => {
    if (!s || s.n <= 0 || s.jump > 0) return;
    s.cool = (s.cool || 0) - dt;
    if (s.cool > 0) return;
    const i = pickPixel(G.cells, W, H, s.c, G.res);
    if (i < 0){ s.cool = 0; return; }
    const grid = findPath(i);
    if (!grid){ s.cool = 0; return; }
    s.cool = SPAWN_MS;
    G.res[i] = 1; s.n--;
    const sl = L.slots[si], hole = {x: L.hole.x, y: L.hole.y};
    // 行き：穴の横を回り込んで盤へ（穴には入らない）／帰り：来た道を戻って穴へ
    const side = (sl.x + sl.s / 2) < L.hole.x ? -1 : 1;
    const by = L.board.y + L.board.h + L.board.cs * .5;
    const around = [{x: L.hole.x + side * (L.hole.r + 18), y: L.hole.y + L.hole.r * .2},
                    {x: L.hole.x + side * (L.hole.r + 10), y: by + (L.hole.y - by) * .35}];
    const go = [{x: sl.x + sl.s / 2, y: sl.y + 4}].concat(around, grid);
    const back = grid.slice().reverse().concat([{x: L.hole.x, y: by}, hole]);
    G.ants.push({go, back, gl: pathLen(go), bl: pathLen(back), d: 0, phase: 0, cell: i, c: s.c});
  });
  G.slots.forEach((s, i) => { if (s && s.n <= 0) G.slots[i] = null; });
  // アリを歩かせる
  for (const a of G.ants){
    a.d += ANT_SPEED * dt / 1000;
    if (a.phase === 0 && a.d >= a.gl){
      // ピクセルを受け取って、来た道を戻る
      G.cells[a.cell] = -1; G.res[a.cell] = 0; G.left--;
      a.phase = 1; a.d = 0;
    } else if (a.phase === 1 && a.d >= a.bl) a.phase = 2;
  }
  G.ants = G.ants.filter(a => a.phase < 2);
  if (G.left <= 0 && !G.ants.length){ win(); return; }
  if (!G.ants.length) checkStuck();
}
function checkStuck(){
  if (G.slots.includes(null)) {
    if (G.cols.some(c => c.length)) return;  // まだ置ける
  }
  const canMove = G.slots.some(s => s && s.n > 0 && pickPixel(G.cells, G.pz.W, G.pz.H, s.c, G.res) >= 0);
  if (canMove) return;
  G.over = true;
  $('loseAdd').style.display = (G.added || G.slots.length >= 8) ? 'none' : 'block';
  setTimeout(() => $('loseOv').classList.add('on'), 400);
}
function win(){
  G.won = true;
  const c = document.createElement('canvas'); c.width = G.pz.W * 8; c.height = G.pz.H * 8;
  const x = c.getContext('2d');
  G.pz.cells.forEach((v, i) => { const p = G.pz.palette[v]; x.fillStyle = `rgb(${p})`; x.fillRect((i % G.pz.W) * 8, ((i / G.pz.W) | 0) * 8, 8, 8); });
  $('winImg').src = c.toDataURL();
  buzz([20, 60, 20]);
  setTimeout(() => $('winOv').classList.add('on'), 500);
}
function hideOv(){ $('winOv').classList.remove('on'); $('loseOv').classList.remove('on'); }
function buzz(p){ try{ navigator.vibrate && navigator.vibrate(p); }catch(e){} }

// ===== 描画 =====
function rgb(p, k = 1){ return `rgb(${Math.min(255, p[0]*k)|0},${Math.min(255, p[1]*k)|0},${Math.min(255, p[2]*k)|0})`; }
function textColor(p){ return (p[0]*.3 + p[1]*.59 + p[2]*.11) > 170 ? '#4a3420' : '#ffffff'; }
function rr(x, y, w, h, r){ ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }

function drawBlock(x, y, s, p, label, alpha = 1, glow = false){
  ctx.globalAlpha = alpha;
  if (glow){ ctx.fillStyle = '#fff'; rr(x - 4, y - 4, s + 8, s + 8, s * .24); ctx.fill(); }
  ctx.fillStyle = rgb(p, .72); rr(x, y + s * .08, s, s * .92, s * .2); ctx.fill();
  ctx.fillStyle = rgb(p); rr(x, y, s, s * .86, s * .2); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.18)'; rr(x + s*.1, y + s*.07, s*.8, s*.25, s*.12); ctx.fill();
  if (label !== ''){
    ctx.font = `900 ${s * .42}px system-ui, sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.lineWidth = s * .08; ctx.strokeStyle = 'rgba(0,0,0,.35)'; ctx.strokeText(label, x + s/2, y + s*.44);
    ctx.fillStyle = textColor(p); ctx.fillText(label, x + s/2, y + s*.44);
  }
  ctx.globalAlpha = 1;
}
function drawMystery(x, y, s){
  ctx.fillStyle = '#5d4a9e'; rr(x, y + s*.08, s, s*.92, s*.2); ctx.fill();
  ctx.fillStyle = '#7f6bc6'; rr(x, y, s, s*.86, s*.2); ctx.fill();
  ctx.font = `900 ${s * .5}px system-ui, sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = '#fff'; ctx.fillText('?', x + s/2, y + s*.45);
}
// アリは運ぶ色と同じ色。明るい色でも見えるよう、暗めのふちどりをつける
function drawAnt(x, y, sz, ang, p){
  p = p || [43, 37, 48];
  const body = rgb(p), edge = rgb(p, .55);
  ctx.save(); ctx.translate(x, y); ctx.rotate(ang);
  ctx.strokeStyle = edge; ctx.lineWidth = sz*.09;
  for (const k of [-1, 1]) for (const o of [-.25, 0, .25]){
    ctx.beginPath(); ctx.moveTo(o*sz, 0); ctx.lineTo(o*sz + sz*.15, k*sz*.55); ctx.stroke();
  }
  ctx.fillStyle = body; ctx.lineWidth = Math.max(1, sz*.07);
  for (const [cx, rx, ry] of [[-sz*.55, sz*.42, sz*.32], [0, sz*.28, sz*.24], [sz*.42, sz*.26, sz*.24]]){
    ctx.beginPath(); ctx.ellipse(cx, 0, rx, ry, 0, 0, Math.PI*2); ctx.fill(); ctx.stroke();
  }
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(sz*.5, -sz*.08, sz*.1, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#222'; ctx.beginPath(); ctx.arc(sz*.53, -sz*.08, sz*.05, 0, Math.PI*2); ctx.fill();
  ctx.restore();
}

function draw(dt){
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, VW, VH);
  if (!G) return;
  const {board: b, hole: h} = L;
  // 盤
  ctx.fillStyle = '#ead8c6'; rr(b.x - 12, b.y - 12, b.w + 24, b.h + 24, 18); ctx.fill();
  const W = G.pz.W, cs = b.cs, gap = cs > 7 ? 1 : 0;
  for (let i = 0; i < G.cells.length; i++){
    const v = G.cells[i]; if (v < 0) continue;
    const x = b.x + (i % W) * cs, y = b.y + ((i / W) | 0) * cs, p = G.pz.palette[v];
    ctx.globalAlpha = G.res[i] ? .55 : 1;
    ctx.fillStyle = rgb(p, .8); ctx.fillRect(x + gap, y + gap, cs - gap, cs - gap);
    ctx.fillStyle = rgb(p); ctx.fillRect(x + gap, y + gap, cs - gap - cs*.12, cs - gap - cs*.12);
  }
  ctx.globalAlpha = 1;
  // 穴
  ctx.fillStyle = '#7a4a2a'; ctx.beginPath(); ctx.ellipse(h.x, h.y, h.r, h.r*.62, 0, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#4f2d17'; ctx.beginPath(); ctx.ellipse(h.x, h.y + 3, h.r*.86, h.r*.5, 0, 0, Math.PI*2); ctx.fill();
  // アリ
  const antSz = Math.max(10, Math.min(16, cs * 1.3));
  for (const a of G.ants){
    const p = posOn(a.phase === 0 ? a.go : a.back, a.d);
    const wob = Math.sin(a.d * .35) * .12;
    drawAnt(p.x, p.y, antSz, p.ang + wob, G.pz.palette[a.c]);
    if (a.phase === 1){
      const q = Math.max(5, cs * .8);
      ctx.fillStyle = rgb(G.pz.palette[a.c]);
      ctx.fillRect(p.x - q/2 + Math.cos(p.ang) * antSz * .1, p.y - q/2 - antSz * .45, q, q);
      ctx.strokeStyle = 'rgba(0,0,0,.25)'; ctx.lineWidth = 1;
      ctx.strokeRect(p.x - q/2 + Math.cos(p.ang) * antSz * .1, p.y - q/2 - antSz * .45, q, q);
    }
  }
  // スロット
  G.slots.forEach((s, i) => {
    const r = L.slots[i];
    ctx.fillStyle = '#fffaf3'; rr(r.x, r.y, r.s, r.s, r.s * .18); ctx.fill();
    if (!s) return;
    if (s.jump > 0){ s.jump = Math.max(0, s.jump - dt / 220); }
    const k = 1 - s.jump, x = s.fx + (r.x - s.fx) * k, y = s.fy + (r.y - s.fy) * k - Math.sin(k * Math.PI) * 40;
    drawBlock(x, y, r.s, G.pz.palette[s.c], String(s.n));
  });
  // ブロックの列（先頭はタップ可能、2つ目は薄く数字、3つ目以降は？）
  G.cols.forEach((col, ci) => {
    const c = L.cols[ci];
    for (let d = Math.min(2, col.length - 1); d >= 0; d--){
      const y = c.y + d * c.s * .95;
      if (d === 0) drawBlock(c.x, y, c.s, G.pz.palette[col[0].c], String(col[0].n), 1, true);
      else if (d === 1) drawBlock(c.x, y, c.s, G.pz.palette[col[d].c], String(col[d].n), .55);
      else drawMystery(c.x, y, c.s);
    }
    if (col.length > 3){
      ctx.font = '700 13px system-ui'; ctx.fillStyle = '#8a6440'; ctx.textAlign = 'center';
      ctx.textBaseline = 'top'; ctx.fillText('あと' + (col.length - 3), c.x + c.s/2, c.y + c.s * 2.9 + 8);
    }
  });
  // 残り
  ctx.font = '800 14px system-ui'; ctx.fillStyle = '#8a6440'; ctx.textAlign = 'left'; ctx.textBaseline = 'top';
  ctx.fillText(`のこり ${G.left}`, 12, 0);
  // ポップ表示
  G.pops = G.pops.filter(p => p.t < 1);
  for (const p of G.pops){
    p.t += dt / 1000;
    ctx.globalAlpha = 1 - p.t; ctx.font = '800 15px system-ui'; ctx.textAlign = 'center'; ctx.fillStyle = '#c0392b';
    ctx.fillText(p.text, p.x, p.y - p.t * 20); ctx.globalAlpha = 1;
  }
}

let last = performance.now();
function frame(now){
  const dt = Math.min(100, now - last); last = now;
  update(dt);
  draw(dt);
  requestAnimationFrame(frame);
}

// ===== 写真の読み込み =====
function loadImage(src){ return new Promise((ok, ng) => { const i = new Image(); i.onload = () => ok(i); i.onerror = ng; i.src = src; }); }
async function startFromSrc(src, seed){
  const img = await loadImage(src);
  newGame(pixelate(img, +opts.size, +opts.colors), seed);
}
async function setPhoto(file){ setPhotoUrl(URL.createObjectURL(file)); }
async function setPhotoUrl(url){
  closeStart();
  let img;
  try { img = await loadImage(url); } catch(e){ if (url.startsWith('blob:')) URL.revokeObjectURL(url); openStart(); return; }
  openCrop(img, async rect => {
    // 選んだ範囲だけを保存（最大360px）
    const m = 360, s = Math.min(1, m / Math.max(rect.w, rect.h));
    const c = document.createElement('canvas'); c.width = Math.max(1, Math.round(rect.w * s)); c.height = Math.max(1, Math.round(rect.h * s));
    c.getContext('2d').drawImage(img, rect.x, rect.y, rect.w, rect.h, 0, 0, c.width, c.height);
    if (url.startsWith('blob:')) URL.revokeObjectURL(url);
    srcData = c.toDataURL('image/jpeg', .9);
    save('photo', srcData);
    await startFromSrc(srcData);
  });
}
// ===== 切り抜き画面：指でなぞって範囲を選ぶ =====
function openCrop(img, done){
  const ov = $('cropOv'), cc = $('cropCv'), x = cc.getContext('2d');
  ov.classList.add('on');
  const r = window.devicePixelRatio || 1;
  const maxW = window.innerWidth - 24, maxH = window.innerHeight - 170;
  const sc = Math.min(maxW / img.width, maxH / img.height);
  const w = img.width * sc, h = img.height * sc;
  cc.style.width = w + 'px'; cc.style.height = h + 'px'; cc.width = w * r; cc.height = h * r;
  let sel = {x: 0, y: 0, w, h}, start = null;
  const paint = () => {
    x.setTransform(r, 0, 0, r, 0, 0);
    x.drawImage(img, 0, 0, w, h);
    x.fillStyle = 'rgba(0,0,0,.5)';
    x.fillRect(0, 0, w, sel.y); x.fillRect(0, sel.y + sel.h, w, h - sel.y - sel.h);
    x.fillRect(0, sel.y, sel.x, sel.h); x.fillRect(sel.x + sel.w, sel.y, w - sel.x - sel.w, sel.h);
    x.strokeStyle = '#fff'; x.lineWidth = 2; x.setLineDash([6, 4]); x.strokeRect(sel.x, sel.y, sel.w, sel.h); x.setLineDash([]);
  };
  const pos = e => { const b = cc.getBoundingClientRect(); return {x: Math.max(0, Math.min(w, e.clientX - b.left)), y: Math.max(0, Math.min(h, e.clientY - b.top))}; };
  cc.onpointerdown = e => { cc.setPointerCapture(e.pointerId); start = pos(e); sel = {x: start.x, y: start.y, w: 0, h: 0}; paint(); };
  cc.onpointermove = e => { if (!start) return; const p = pos(e);
    sel = {x: Math.min(start.x, p.x), y: Math.min(start.y, p.y), w: Math.abs(p.x - start.x), h: Math.abs(p.y - start.y)}; paint(); };
  cc.onpointerup = () => { start = null; if (sel.w < 20 || sel.h < 20){ sel = {x: 0, y: 0, w, h}; paint(); } };
  paint();
  const finish = useSel => {
    ov.classList.remove('on');
    const s2 = useSel ? sel : {x: 0, y: 0, w, h};
    done({x: s2.x / sc, y: s2.y / sc, w: s2.w / sc, h: s2.h / sc});
  };
  $('cropOk').onclick = () => finish(true);
  $('cropAll').onclick = () => finish(false);
}
// 撮影した写真（アプリから dataURL で届く）
window.onNativePhoto = url => { if (url) setPhotoUrl(url); else openStart(); };
function takePhoto(){
  closeStart();
  if (window.Android && Android.takePhoto) Android.takePhoto(); else $('cam').click();
}
function openStart(){
  $('startLast').style.display = load('photo', null) ? 'block' : 'none';
  $('startOv').classList.add('on');
}
function closeStart(){ $('startOv').classList.remove('on'); }
$('pick').onclick = () => openStart();
$('startCam').onclick = () => takePhoto();
$('startPick').onclick = () => { closeStart(); $('file').click(); };
$('startLast').onclick = () => { closeStart(); srcData = load('photo', null); startFromSrc(srcData); };
$('cam').onchange = e => { const f = e.target.files[0]; if (f) setPhoto(f); else openStart(); e.target.value = ''; };
$('winPick').onclick = () => { hideOv(); openStart(); };
$('file').onchange = e => { const f = e.target.files[0]; if (f) setPhoto(f); e.target.value = ''; };
selColors.onchange = () => { opts.colors = +selColors.value; save('opts', opts); srcData && startFromSrc(srcData); };
$('size').onchange = () => { opts.size = +$('size').value; save('opts', opts); srcData && startFromSrc(srcData); };
$('retry').onclick = () => G && newGame(G.pz, G.seed);
$('winRetry').onclick = () => newGame(G.pz);
$('loseRetry').onclick = () => newGame(G.pz, G.seed);
$('loseAdd').onclick = () => { G.added = true; G.slots.push(null); G.over = false; hideOv(); layout(); };
window.addEventListener('resize', layout);

openStart();
requestAnimationFrame(frame);
</script>
